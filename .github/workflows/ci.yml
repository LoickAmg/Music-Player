name: CI

on:
  push:
    branches: [main]
    tags: ["app-v*"]
  pull_request:
  # Lancement manuel (onglet Actions) : construit l'APK Android sans créer de version.
  workflow_dispatch:

jobs:
  # Feedback rapide sur chaque push/PR : lint + tests backend (Rust) et
  # frontend (Vue), sans construire d'installeur. Tourne uniquement sur
  # Linux, où toutes les libs système Tauri (webkit2gtk, alsa...) sont
  # disponibles via apt.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système Tauri (build Linux + audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev build-essential curl wget file \
            libssl-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run lint

      - name: cargo test (queue, bibliothèque, playlists, session, égaliseur)
        working-directory: src-tauri
        run: cargo test

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build frontend (vérifie que le typecheck + build Vite passent)
        run: npm run build

  # Construit les installeurs natifs (.msi/.exe Windows, .dmg macOS,
  # .deb/.rpm/.AppImage Linux) sur de vraies machines Windows/macOS/Linux
  # fournies par GitHub — on ne peut pas les produire depuis un
  # environnement de build Linux seul (pas de toolchain MSVC/macOS ici).
  # Se déclenche uniquement sur un tag "app-v*" (ex: app-v0.1.0), pour ne
  # pas construire 3 installeurs à chaque commit.
  # La version GitHub est créée une seule fois, avant les constructions en parallèle :
  # sinon plusieurs machines la créent en même temps et elle apparaît en double, les
  # fichiers répartis entre les deux (constaté sur app-v0.4.3).
  create-release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          name: "Music Player ${{ github.ref_name }}"
          body: |
            Installeurs générés automatiquement par la CI pour Windows, macOS, Linux et Android.
            Choisis le fichier correspondant à ton système ci-dessous.
            Les applications déjà installées (à partir de la 0.4.3 sur ordinateur, 0.4.4 sur Android) proposent la mise à jour d'elles-mêmes.

            Configuration requise :
            - Android 8.0 ou plus, Android System WebView à jour (111+) : Music-Player-android-arm64.apk (la plupart des téléphones), Music-Player-android-armv7.apk (anciens téléphones 32 bits) ou Music-Player-android.apk (complet, pour tous)
            - Windows 10/11 64 bits : Music.Player_*_x64-setup.exe
            - macOS 10.15 ou plus, Mac Apple Silicon : Music.Player_*_aarch64.dmg
            - Linux x86_64 (Ubuntu 22.04, Debian 12, Fedora 38 ou plus récents) : .deb, .rpm ou .AppImage

  release:
    needs: [test, create-release]
    if: startsWith(github.ref, 'refs/tags/app-v')
    # Sans cette permission, le jeton par défaut ne peut pas créer la release :
    # « Resource not accessible by integration » (échec constaté sur app-v0.1.0,
    # alors que les 3 installeurs se construisaient correctement).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système Tauri (Linux uniquement)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev build-essential curl wget file \
            libssl-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Mise à jour automatique : les installateurs sont signés et un « latest.json » est
      # joint à la version. Sans la clé, les applis installées refuseraient la mise à jour.
      - name: Clé de mise à jour présente
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY manquant : installateurs non signés pour la mise à jour automatique."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Music Player ${{ github.ref_name }}"
          releaseBody: |
            Installeurs générés automatiquement par la CI pour Windows, macOS, Linux et Android.
            Choisis le fichier correspondant à ton système ci-dessous.
            Les applications déjà installées (à partir de la 0.4.3 sur ordinateur, 0.4.4 sur Android) proposent la mise à jour d'elles-mêmes.

            Configuration requise :
            - Android 8.0 ou plus, Android System WebView à jour (111+) : Music-Player-android-arm64.apk (la plupart des téléphones), Music-Player-android-armv7.apk (anciens téléphones 32 bits) ou Music-Player-android.apk (complet, pour tous)
            - Windows 10/11 64 bits : Music.Player_*_x64-setup.exe
            - macOS 10.15 ou plus, Mac Apple Silicon : Music.Player_*_aarch64.dmg
            - Linux x86_64 (Ubuntu 22.04, Debian 12, Fedora 38 ou plus récents) : .deb, .rpm ou .AppImage
          releaseDraft: false
          prerelease: false

  # APK Android (téléphones arm64 et armv7, Android 8 et plus). Construit sur un tag
  # « app-v* » (et joint à la release) ou à la demande depuis l'onglet Actions.
  android:
    needs: [test, create-release]
    # Aussi sur un push dont le message contient « [android] » (test sans publier) ;
    # « create-release » n'existe que pour un tag (ignorée sinon).
    if: >-
      always() && needs.test.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/app-v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK et le NDK Android sont préinstallés sur les machines Ubuntu de GitHub.
      - name: SDK et NDK Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK : $ANDROID_NDK_LATEST_HOME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: "Projet Android (généré puis complété : permissions musique)"
        run: |
          npx tauri android init --ci
          # Même logo que sur PC (icônes de lancement Android générées dans gen/android)
          npx tauri icon src-tauri/icons/app-icon-source.png
          node scripts/android-patch.mjs

      # Trois APK : complet (arm64 + armv7, pour une installation à la main), et un par type
      # de processeur, environ deux fois plus léger, que l'appli télécharge pour se mettre à
      # jour. La compilation Rust est réutilisée d'un APK à l'autre.
      - name: Compilation des APK
        run: |
          set -o pipefail
          mkdir -p apk-out
          build() {
            if ! npx tauri android build --apk --target "$@" 2>&1 | tee -a build.log; then
              # Les erreurs deviennent des annotations, lisibles sans accès aux journaux.
              grep -iE "error|failed|could not|cannot find|undefined|^e: " build.log | grep -v "^warning" | tail -40 | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
              exit 1
            fi
          }
          latest_apk() {
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -printf "%T@ %p\n" | sort -n | tail -n 1 | cut -d" " -f2-
          }
          build aarch64 armv7
          cp "$(latest_apk)" apk-out/full.apk
          build aarch64
          cp "$(latest_apk)" apk-out/arm64.apk
          build armv7
          cp "$(latest_apk)" apk-out/armv7.apk
          ls -la apk-out

      # Signature : clé fournie par les secrets du dépôt si elle existe (mises à jour
      # sans désinstaller), sinon clé générée pour cette version.
      - name: Signature des APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Une version publiée doit toujours porter la même signature, sinon Android
            # refuse la mise à jour (il faudrait désinstaller).
            echo "::error::Secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD manquants : APK de version non signé."
            exit 1
          else
            PASS="music-player"
            keytool -genkeypair -keystore release.jks -storepass "$PASS" -keypass "$PASS" -alias music-player -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mahouna, O=Music Player, C=FR"
          fi
          BT="$ANDROID_HOME/build-tools/35.0.0"
          sign() {
            "$BT/zipalign" -f -p 4 "apk-out/$1.apk" "apk-out/$1-aligned.apk"
            "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --out "$2" "apk-out/$1-aligned.apk"
          }
          sign full Music-Player-android.apk
          sign arm64 Music-Player-android-arm64.apk
          sign armv7 Music-Player-android-armv7.apk
          ls -la Music-Player-android*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: music-player-android
          path: "Music-Player-android*.apk"

      - name: Ajout des APK à la release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: "Music-Player-android*.apk"
