[package]
name = "music-player"
version = "0.5.4"
description = "Lecteur de musique local avec paroles synchronisées"
authors = ["Mahouna"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png : icône de fenêtre choisie dans la personnalisation (envoyée en PNG).
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }
lofty = "0.25"
# Fichiers importés depuis Android (la vue web y transmet du texte, pas d'octets bruts).
base64 = "0.22"
# Même version que celle de rodio : sert à vérifier qu'un fichier se lit vraiment, et à
# mesurer la durée quand les étiquettes ne la donnent pas.
symphonia = { version = "0.5.5", default-features = false }
rand = "0.8"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2"
rayon = "1"
ureq = { version = "3", features = ["json"] }
# Archives de partage (.mpshare) : « stored » seulement (les fichiers audio sont déjà
# compressés), pas de dépendance C (compilation croisée Android plus simple).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Icône choisie appliquée aux raccourcis Windows : PNG → .ico multi-tailles.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

# Mise à jour automatique depuis les versions GitHub (ordinateur seulement).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Rafraîchir les icônes de l'Explorateur après avoir changé celle des raccourcis.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"


